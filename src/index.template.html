<title>Chicken Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap">
<style>
/* Layout: a full-bleed 3D farm with a game HUD floating over its edges.
   One deliberate look (a farm at work, read through painted signs and a controller LCD), so a single theme. */
:root {
  color-scheme: dark;
  /* text */
  --ink: #f3ecd8;            /* cream text, like sign paint */
  --ink-dim: #c9c1aa;
  --ink-faint: #9d977f;
  /* HUD cards: dark feed-sack green */
  --panel: rgba(24, 36, 30, 0.86);
  --panel-solid: #18241e;
  --panel-raised: #24362c;
  --panel-raised-hi: #2e4337;
  --panel-sunk: rgba(8, 15, 11, 0.42);
  --panel-edge: rgba(243, 236, 216, 0.16);
  --panel-stitch: rgba(243, 236, 216, 0.11);
  --panel-weave: rgba(243, 236, 216, 0.022);
  --shadow: 0 8px 22px rgba(4, 10, 7, 0.32);
  --scrim: rgba(8, 14, 11, 0.5);
  /* signals */
  --accent: #f28c28;         /* brooder flame orange */
  --accent-ink: #1e1305;
  --accent-soft: rgba(242, 140, 40, 0.16);
  --focus: #ffd447;
  --lcd: #b9e27a;            /* controller LCD green */
  --lcd-shade: #a5cf68;
  --lcd-ink: #1f2d12;
  --lcd-ghost: rgba(31, 45, 18, 0.12);
  --cold: #6cb8f0;
  --ok: #8fd17a;
  --hot: #f0664a;
  --sky: #bfd9ea;
  /* painted sign board */
  --sign-face: #1d4a37;
  --sign-face-lo: #173d2d;
  --sign-paint: #f6f1e2;
  --sign-paint-dim: #c6d2c0;
  --sign-rule: rgba(246, 241, 226, 0.28);
  --sign-yellow: #e7b646;
  --sign-yellow-ink: #2a200c;
  --wood: #7a5232;
  --wood-dark: #553821;
  --wood-light: #93673f;
  --bolt-hi: #ece6d6;
  --bolt-lo: #7d7768;
  --chick: #f5d36b;
  /* climate controller hardware */
  --case-hi: #dad6ca;
  --case-lo: #b3ae9f;
  --case-ink: #2d302c;
  --case-ink-dim: #5d5f57;
  --plate: #262d31;
  --plate-edge: #11161a;
  --key: #465057;
  --key-hi: #5b666e;
  --key-ink: #f2f1ea;
  --led-heat: #ff8a2a;
  --led-pad: #52c3f2;
  --led-run: #8fe36a;
  --led-off: #3b4145;
  --key-hover: #67737b;
  --key-edge: #161b1f;
  --key-sub: #a8b1b5;
  --key-on-hi: #3f87ab;
  --key-on-lo: #2b6787;
  --screw-hi: #f6f3ea;
  --screw-lo: #8e8979;
  --sign-shade: rgba(0, 0, 0, 0.16);
  /* boot hen (matches the 3D broiler palette in config.js) */
  --hen: #f4f1ea;
  --hen-shade: #ddd7c7;
  --hen-tail: #d9d3c2;
  --hen-comb: #d8322f;
  --hen-beak: #f2a33a;
  /* type */
  --font-display: "Chakra Petch", "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Sarabun", "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
  --gutter: 16px;
  --top: calc(var(--gutter) + env(safe-area-inset-top, 0px));
  --left: max(var(--gutter), env(safe-area-inset-left, 0px));
  --right: max(var(--gutter), env(safe-area-inset-right, 0px));
  --bottom: calc(var(--gutter) + env(safe-area-inset-bottom, 0px));
  --jobs-w: 288px;
}
html, body { height: 100%; }
body { margin: 0; background: var(--panel-solid); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
#app { position: fixed; inset: 0; overflow: hidden; }
#game { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
#hud { position: absolute; inset: 0; pointer-events: none; font-variant-numeric: tabular-nums; font-size: 14px; line-height: 1.35; }
#hud * { box-sizing: border-box; }
#hud .card, #hud button, #hud input, #hud select, #hud .panel, #hud .scrim, #hud .narrow { pointer-events: auto; }
.icon { width: 1em; height: 1em; flex: none; display: inline-block; vertical-align: -0.15em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- boot card (main.js hides #boot when the farm is ready) ---------- */
#boot { position: absolute; inset: 0; display: grid; place-items: center; background: var(--panel-solid); color: var(--ink); font-family: var(--font-body); padding-inline: max(var(--gutter), env(safe-area-inset-left, 0px)); text-align: center;
  background-image: radial-gradient(ellipse at 50% 120%, rgba(127, 174, 78, 0.22), transparent 60%); }
#boot.boot--error { font-size: 16px; line-height: 1.5; padding-inline: max(var(--gutter), calc((100% - 520px) / 2)); }
.boot-card { width: min(360px, 100%); display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; text-align: left; padding: 20px 22px; border-radius: 10px; background: var(--panel-raised); border: 1px solid var(--panel-edge); box-shadow: var(--shadow); }
.boot-mark { grid-row: span 2; width: 64px; height: 48px; }
.boot-title { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: 0.02em; margin: 0; }
.boot-sub { margin: 0; color: var(--ink-dim); font-size: 15px; }
.boot-bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; margin-top: 10px; background: var(--panel-sunk); overflow: hidden; }
.boot-bar::before { content: ""; display: block; height: 100%; width: 40%; border-radius: 3px; background: var(--accent); animation: boot-slide 1.6s ease-in-out infinite alternate; }
@keyframes boot-slide { from { transform: translateX(-10%); } to { transform: translateX(160%); } }

/* ---------- HUD cards: feed-sack green, a stitched seam, a faint weave ---------- */
.card { position: relative; background-color: var(--panel); color: var(--ink); border: 1px solid var(--panel-edge); border-radius: 8px; box-shadow: var(--shadow);
  background-image: repeating-linear-gradient(0deg, var(--panel-weave) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, var(--panel-weave) 0 1px, transparent 1px 3px); }
.card::after { content: ""; position: absolute; inset: 3px; border: 1px dashed var(--panel-stitch); border-radius: 6px; pointer-events: none; }
.label { font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink-dim); }
.unit { font-size: 0.5em; font-weight: 500; color: var(--ink-dim); margin-left: 0.18em; letter-spacing: 0.02em; }

.hud-tl { position: absolute; top: var(--top); left: var(--left); max-width: calc(100% - var(--jobs-w) - var(--left) - var(--right) - 16px); display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
.hud-tr { position: absolute; top: var(--top); right: var(--right); width: var(--jobs-w); }
.hud-bl { position: absolute; left: var(--left); bottom: var(--bottom); display: flex; flex-direction: column; align-items: flex-start; gap: 10px; max-width: calc(100% - var(--left) - var(--right)); }
.hud-br { position: absolute; right: var(--right); bottom: var(--bottom); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; max-height: var(--tools-room, calc(100% - var(--top) - var(--bottom) - 320px)); min-height: 0; }
.hud-bc { position: absolute; left: 50%; bottom: calc(var(--bottom) + 76px); transform: translateX(-50%); }

/* farm clock */
.clock { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 12px; padding: 7px 12px 8px; min-width: 150px; }
.clock-day { font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
.clock-time { font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1; letter-spacing: 0.02em; margin-top: 1px; }
.clock-sky { grid-row: 1 / span 2; grid-column: 2; font-size: 24px; color: var(--sign-yellow); }
.clock-sky.is-night { color: var(--ink-dim); }
.clock-weather { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--panel-edge); color: var(--ink-dim); font-size: 12px; white-space: nowrap; }
.clock-weather .icon { font-size: 14px; color: var(--ink); }
.clock-rate { margin-left: auto; font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }
.clock-rate.is-paused { color: var(--accent); }

/* gauge strip */
.gauges { display: flex; align-items: stretch; padding: 3px; }
.gauge { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 4px 11px; min-width: 76px; }
.gauge + .gauge { border-left: 1px solid var(--panel-edge); }
.gauge .label { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.gauge .label .icon { font-size: 13px; color: var(--ink); }
.gauge-value { font-family: var(--font-display); font-weight: 600; font-size: 19px; line-height: 1.05; white-space: nowrap; }
.gauge--main { min-width: 104px; }
.gauge--main .gauge-value { font-size: 28px; }
.gauge-sub { font-size: 11px; color: var(--ink-faint); white-space: nowrap; }
.pips { display: flex; gap: 3px; margin-top: 2px; }
.pip { width: 9px; height: 5px; border-radius: 1px; background: var(--panel-sunk); box-shadow: inset 0 0 0 1px var(--panel-edge); }
.pip.is-on { background: var(--ink); box-shadow: none; }
.gauge--burner .gauge-value { display: flex; align-items: center; gap: 6px; }
.gauge--burner .flame { font-size: 19px; color: var(--ink-faint); transition: color 0.3s, filter 0.3s; }
.gauge--burner.is-on .flame { color: var(--accent); filter: drop-shadow(0 0 6px rgba(242, 140, 40, 0.65)); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 34px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--panel-edge); background: var(--panel-raised); color: var(--ink); font: 600 13px/1.1 var(--font-display); letter-spacing: 0.03em; cursor: pointer; white-space: nowrap; }
.btn .icon { font-size: 17px; }
.btn:hover { background: var(--panel-raised-hi); }
.btn:active { transform: translateY(1px); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }
.btn:disabled:hover { background: var(--panel-raised); }
.btn--icon { width: 38px; padding: 0; }
#hud button:focus-visible, #hud input:focus-visible, #hud select:focus-visible, #hud [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.kbd { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 5px; background: var(--ink); color: var(--panel-solid); font: 700 13px/1 var(--font-display); box-shadow: inset 0 -2px 0 var(--ink-faint); }

/* time controls */
.timebar { display: flex; align-items: center; gap: 6px; padding: 7px; }
.seg { display: inline-flex; }
.seg .btn { border-radius: 0; }
.seg .btn:first-child { border-radius: 6px 0 0 6px; }
.seg .btn:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
.timebar-sep { width: 1px; align-self: stretch; margin: 2px 3px; background: var(--panel-edge); }
/* today's jobs */
.jobs { padding: 10px; }
.jobs-head { display: flex; align-items: center; gap: 8px; padding: 0 2px 7px; border-bottom: 1px solid var(--panel-edge); }
.jobs-icon { display: inline-flex; font-size: 18px; color: var(--accent); }
.jobs-head h2 { margin: 0; font-size: 12px; color: var(--ink); }
.jobs-count { margin-left: auto; font: 600 12px/1 var(--font-display); color: var(--ink-dim); letter-spacing: 0.06em; }
.jobs-list { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; }
.job { display: grid; grid-template-columns: 20px 1fr; gap: 9px; padding: 5px 8px 5px 7px; border-radius: 6px; border-left: 3px solid transparent; color: var(--ink-faint); }
.job-mark { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid currentColor; font: 700 11px/1 var(--font-display); }
.job-mark .icon { font-size: 12px; }
.job-title { margin: 1px 0 0; font-size: 13.5px; font-weight: 500; line-height: 1.3; }
.job.is-current { background: var(--accent-soft); border-left-color: var(--accent); color: var(--ink); }
.job.is-current .job-mark { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.job.is-current .job-title { font-weight: 600; }
.job.is-done { color: var(--ink-dim); }
.job.is-done .job-mark { border-color: transparent; background: var(--panel-sunk); color: var(--ink); }
/* compact card: finished jobs fold into the count in the header (a just-finished one shows its tick
   for a moment), and of the jobs still to come only the next one is listed */
.job.is-done:not(.just-done), .job.is-later { display: none; }
#hud.has-panel .hud-tr { visibility: hidden; } /* an open sign or controller never overlaps the jobs */
.job-where { display: flex; gap: 6px; margin: 4px 0 0; font-size: 12.5px; line-height: 1.4; color: var(--ink-dim); }
.job-where .icon { font-size: 14px; color: var(--accent); margin-top: 2px; }
.job-progress { margin-top: 8px; height: 4px; border-radius: 2px; background: var(--panel-sunk); overflow: hidden; }
.job-bar { display: block; height: 100%; background: var(--accent); transform-origin: left center; transform: scaleX(0); }
.job.just-done .job-mark { animation: job-pop 0.6s ease-out; }
@keyframes job-pop { from { transform: scale(1.3); } to { transform: none; } }
.jobs-done { margin: 9px 2px 1px; padding-top: 10px; border-top: 1px solid var(--panel-edge); font-size: 13.5px; line-height: 1.45; color: var(--ink); }

/* edge pointer toward an off-screen job */
.edge-pointer { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 7px; padding: 4px 10px 4px 4px; border-radius: 999px; border: 1px solid var(--panel-edge); background: var(--panel); color: var(--ink); box-shadow: var(--shadow); font: 600 13px/1 var(--font-display); white-space: nowrap; will-change: transform; }
.edge-arrow { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); }
.edge-arrow .icon { font-size: 17px; }

/* "E  Read the ... sign" prompt */
.prompt { display: flex; align-items: center; gap: 11px; padding: 6px 18px 6px 6px; border-radius: 999px; border: 1px solid var(--panel-edge); background-color: var(--panel); color: var(--ink); box-shadow: var(--shadow); font: 500 15px/1.2 var(--font-body); cursor: pointer; white-space: nowrap; }
.prompt:hover { background-color: var(--panel-raised); }
.prompt .kbd { height: 30px; min-width: 30px; font-size: 15px; background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.22); }
.prompt b { font-weight: 600; }

/* controls legend */
.help { width: 286px; padding: 10px 12px 11px; }
.help-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.help-head .icon { font-size: 18px; color: var(--accent); }
.help-head h2 { margin: 0; font-size: 12px; color: var(--ink); }
.help-head .btn { margin-left: auto; min-height: 28px; padding: 4px 10px; font-size: 12px; }
.help-list { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; margin: 0; }
.help-list dt { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; }
.help-list dd { margin: 0; font-size: 12.5px; line-height: 1.3; color: var(--ink-dim); }
.help .kbd { min-width: 22px; height: 22px; font-size: 11.5px; }

/* Phase 1 test tools: tape-marked so nobody mistakes them for the game */
.tools-toggle { position: relative; padding-left: 20px; border-style: dashed; border-color: rgba(231, 182, 70, 0.6); background: var(--panel-solid); }
.tools-toggle::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 9px; border-radius: 5px 0 0 5px; background: repeating-linear-gradient(-45deg, var(--sign-yellow) 0 5px, var(--sign-yellow-ink) 5px 10px); }
.tools-toggle .chev { display: inline-flex; font-size: 15px; }
.tools-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
.tools { width: 340px; padding: 11px 14px 12px; overflow: auto; overscroll-behavior: contain; min-height: 0; max-height: 100%; }
.tools[hidden] { display: none; }
.tools-note { margin: 0 0 10px; font-size: 12.5px; line-height: 1.35; color: var(--ink-faint); }
.field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; margin-bottom: 8px; }
.field > label, .field > .field-label { font-size: 13px; color: var(--ink-dim); display: flex; align-items: center; gap: 7px; }
.field output { font: 600 14px/1 var(--font-display); color: var(--ink); }
.field input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 2px 0 0; accent-color: var(--accent); }
.field input[type="range"]:disabled { opacity: 0.4; }
.field input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.field select { font: 500 13px/1.2 var(--font-body); color: var(--ink); background: var(--panel-raised); border: 1px solid var(--panel-edge); border-radius: 6px; padding: 5px 8px; }
.readouts { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 3px 10px; margin: 4px 0 10px; padding: 8px 11px; border-radius: 6px; background: var(--panel-sunk); font-size: 13px; }
.readouts .rd-wide { grid-column: span 3; }
.readouts dt { color: var(--ink-dim); }
.readouts dd { margin: 0; font: 600 14px/1.3 var(--font-display); text-align: right; }
.readouts .rd-target { color: var(--sign-yellow); }
.tools-sub { margin: 2px 0 6px; font-size: 11px; }
.tools-foot { display: flex; align-items: center; gap: 10px; }
.tools-status { font-size: 12.5px; color: var(--ink-dim); }

/* small screens: the game needs a keyboard and mouse */
.narrow { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(12, 20, 16, 0.86); z-index: 30; }
.narrow-card { width: min(380px, 100%); padding: 22px 22px 20px; }
.narrow-card .icon { font-size: 34px; color: var(--accent); }
.narrow-card h2 { margin: 10px 0 8px; font: 600 20px/1.25 var(--font-display); color: var(--ink); }
.narrow-card p { margin: 0 0 18px; font-size: 15px; line-height: 1.5; color: var(--ink-dim); }
/* ---------- dialogs ---------- */
/* Panels open at once (no fade): a slow frame must never show a half-drawn sign. */
.scrim { position: absolute; inset: 0; z-index: 10; background: var(--scrim); }
.panel { position: absolute; left: 50%; top: 50%; z-index: 11; transform: translate(-50%, -50%); max-width: calc(100% - 2 * var(--gutter)); max-height: calc(100% - 2 * var(--gutter)); overflow: auto; overscroll-behavior: contain; outline: none; }
#hud .panel:focus-visible { outline: none; }
.panel-close { position: absolute; top: 28px; right: 30px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; padding: 5px 5px 5px 9px; border-radius: 6px; border: 1px solid rgba(0, 0, 0, 0.3); background: rgba(16, 24, 19, 0.6); color: var(--ink); font: 600 12px/1 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
.panel-close:hover { background: rgba(16, 24, 19, 0.85); }
.panel-close .icon { font-size: 14px; }
.panel-close .kbd { height: 20px; min-width: 0; padding: 0 5px; font-size: 10.5px; }

/* ---------- painted sign board ---------- */
.sign { width: min(880px, calc(100% - 2 * var(--gutter))); }
.sign--gate { width: min(620px, calc(100% - 2 * var(--gutter))); }
.sign-board { position: relative; padding: 16px; border-radius: 7px; background-color: var(--wood);
  background-image: repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.08) 0 2px, transparent 2px 11px, rgba(255, 255, 255, 0.05) 11px 12px, transparent 12px 27px), linear-gradient(180deg, var(--wood-light), var(--wood) 35%, var(--wood-dark));
  box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.18), inset 0 -3px 0 rgba(0, 0, 0, 0.3); }
.bolt { position: absolute; z-index: 1; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--bolt-hi), var(--bolt-lo) 72%); box-shadow: 0 1px 1px rgba(0, 0, 0, 0.45); }
.bolt--tl { top: 3px; left: 3px; } .bolt--tr { top: 3px; right: 3px; } .bolt--bl { bottom: 3px; left: 3px; } .bolt--br { bottom: 3px; right: 3px; }
.sign-face { position: relative; border-radius: 3px; color: var(--sign-paint); background: linear-gradient(180deg, var(--sign-face), var(--sign-face-lo)); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35), inset 0 0 60px rgba(0, 0, 0, 0.22); }
.sign-face::before { content: ""; position: absolute; inset: 7px; border: 2px solid var(--sign-paint); border-radius: 2px; opacity: 0.8; pointer-events: none; }
.sign-head { padding: 24px 28px 12px; }
.sign-kicker { display: inline-block; margin: 0; padding: 3px 9px; border-radius: 2px; background: var(--sign-yellow); color: var(--sign-yellow-ink); font: 700 11.5px/1.2 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; }
.sign-title { margin: 8px 0 0; padding-right: 150px; font: 700 25px/1.12 var(--font-display); letter-spacing: 0.02em; text-transform: uppercase; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.3); }
.sign-body { padding: 6px 28px 26px; font-size: 15px; line-height: 1.45; }
.sign-text { margin: 0; font-size: 15.5px; line-height: 1.45; }
.src { margin: 5px 0 0; font-size: 12.5px; color: var(--sign-paint-dim); }

// If three.js cannot load (no network, filtered CDN) the module below never runs: say so instead

(function () {
  function fail() {
    if (window.__game) return;
    var b = document.getElementById('boot');
    if (!b || b.hidden || b.classList.contains('boot--error')) return;
    b.classList.add('boot--error');
    b.textContent = 'Could not load the 3D library (cdn.jsdelivr.net). Check the internet connection and reload the page.';
  }
  window.__bootFail = fail;
  setTimeout(fail, 20000);
})();
