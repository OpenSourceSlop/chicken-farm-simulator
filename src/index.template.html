.result .week .book-note { color: var(--ink-faint); }
.result .ledger--week tr.notes-row td { color: var(--ink-faint); }

/* ================= Phase 3: the run ================= */
/* title card: the buttons on the left, the run card on the right */
.title-card { width: min(940px, 100%); max-height: calc(100vh - 2 * var(--gutter)); overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 22px; padding: 22px 24px 18px; }
.title-card .title-h { font-size: 28px; }
.title-card .title-line { font-size: 15px; margin-bottom: 14px; }
.title-btns .btn.is-confirm { background: var(--sign-yellow); border-color: var(--sign-yellow); color: var(--sign-yellow-ink); }
.runcard { min-width: 0; padding: 12px 12px 10px; border-radius: 8px; background: var(--panel-sunk); border: 1px solid var(--panel-edge); }
.runcard-h { margin: 0 0 8px; font: 700 12.5px/1.2 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--sign-yellow); }
.runcard-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.runcard-row { display: grid; grid-template-columns: 26px minmax(0, 1fr); align-items: center; gap: 8px; padding: 4px 8px; border-radius: 6px; background: var(--panel-raised); border: 1px solid transparent; }
.runcard-row.is-playing { border-color: rgba(242, 140, 40, 0.55); }
.runcard-row.is-later { background: transparent; border-color: var(--panel-edge); }
.runcard-row.is-later .runcard-title, .runcard-row.is-later .runcard-target { color: var(--ink-faint); }
.runcard-n { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--panel-sunk); font: 700 13px/1 var(--font-display); color: var(--ink-dim); }
.runcard-body { min-width: 0; }
.runcard-title { margin: 0; font: 700 14px/1.2 var(--font-display); color: var(--ink); }
.runcard-title small { font: 500 12px/1 var(--font-body, inherit); color: var(--ink-faint); }
.runcard-target, .runcard-meta { margin: 1px 0 0; font-size: 12px; line-height: 1.3; color: var(--ink-dim); }
.runcard-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px 8px; }
.runcard-state { font-weight: 600; color: var(--ink); }
.runcard-state--not-reached { font-weight: 400; color: var(--ink-faint); }
.runcard-key { color: var(--ink); }
.runcard-replay { min-height: 24px; padding: 1px 8px; font-size: 12px; white-space: nowrap; }
.runcard-replay .icon { font-size: 14px; }
.runcard-replay.is-confirm { white-space: normal; max-width: 190px; border-color: var(--sign-yellow); color: var(--sign-yellow); }
.runcard-harder, .runcard-note { margin: 8px 2px 0; font-size: 12px; line-height: 1.4; color: var(--ink-faint); }
.runcard-note { color: var(--sign-yellow); }
/* the card while a standard start plays the ideal farmer */
.busy { position: absolute; inset: 0; z-index: 12; display: grid; place-items: center; background: var(--scrim); pointer-events: auto; }
.busy-card { display: flex; align-items: center; gap: 12px; padding: 16px 22px; font: 600 16px/1.3 var(--font-display); color: var(--ink); }
.busy-icon .icon { font-size: 24px; color: var(--accent); }
/* Phase 4 (PHASE4.md §1.2): the harder flocks, the level rows' flock choice, the condition on the HUD clock, the alarm */
/* the run card scrolls inside its column (the title's buttons stay put); a long Continue line wraps */
@media (min-width: 861px) { .title-card { align-items: start; } .title-card .runcard { max-height: calc(100vh - 2 * var(--gutter) - 44px); overflow-y: auto; overscroll-behavior: contain; } }
.title-btns .btn--big { white-space: normal; text-align: left; line-height: 1.2; }
/* Phase 5 (§6.4): the title card's left column fits a 600 px high window with the new quiet keys (Load, Settings, How to play) */
@media (max-height: 700px) and (min-width: 700px) {
  .title-card { padding-top: 18px; padding-bottom: 16px; }
  .title-card .title-h { font-size: 24px; margin: 6px 0; }
  .title-card .title-line { font-size: 14px; line-height: 1.4; margin-bottom: 10px; }
  .title-btns { gap: 6px; } .title-btns .btn--big { min-height: 40px; padding-top: 6px; padding-bottom: 6px; font-size: 15px; }
  .title-save, .title-first { margin-top: 8px; }
  .title-more { gap: 6px; margin-top: 10px; padding-top: 10px; } .title-more .btn { min-height: 30px; padding: 4px 10px; }
  .title-keys { margin-top: 10px; gap: 4px 12px; }
}
.runcard-cond { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 3px; }
